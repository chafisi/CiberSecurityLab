<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace de Servicios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }
        .header h1 {
            margin: 0;
        }
        .services {
            display: flex;
            flex-wrap: wrap;
        }
        .service {
            background-color: #fff;
            margin: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: calc(50% - 20px);
        }
        .service h2 {
            margin: 0;
        }
        .service p {
            margin: 10px 0;
        }
        .service img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Marketplace de Servicios</h1>
        </div>
        <div class="services">
            <div class="service">
                <img src="service1.jpg" alt="Servicio 1">
                <h2>Servicio 1</h2>
                <p>Descripción del servicio 1...</p>
            </div>
            <div class="service">
                <img src="service2.jpg" alt="Servicio 2">
                <h2>Servicio 2</h2>
                <p>Descripción del servicio 2...</p>
            </div>
            <div class="service">
                <img src="service3.jpg" alt="Servicio 3">
                <h2>Servicio 3</h2>
                <p>Descripción del servicio 3...</p>
            </div>
            <div class="service">
                <img src="service4.jpg" alt="Servicio 4">
                <h2>Servicio 4</h2>
                <p>Descripción del servicio 4...</p>
            </div>
        </div>
    </div>
    <script>
        // Código JavaScript adicional puede ir aquí
    </script>
</body>
</html>
