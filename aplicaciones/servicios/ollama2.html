<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webel Marketplace</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #007BFF;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .search {
            flex: 1;
            margin: 0 10px;
        }
        .search input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }
        .login-btn {
            background-color: white;
            color: #007BFF;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #0056b3;
            color: white;
        }
        @media (max-width: 600px) {
            .search {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Webel</div>
        <div class="search">
            <input type="text" placeholder="Busca un servicio">
        </div>
        <button class="login-btn">Entrar</button>
    </header>
</body>
</html>
